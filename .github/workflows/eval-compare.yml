name: Eval Compare Gate

# Manually triggered on purpose (see repo learning notes): this job reads the two
# JSON snapshots already committed at baselines/baseline.json and baselines/candidate.json
# and asks evals/compare.py whether the candidate is safe to promote. It does NOT build the
# retriever or call any LLM -- no OPENAI_API_KEY needed, no cost, seconds to run.
#
# Running the full evals.run_suite in CI (to generate a fresh candidate.json here, rather
# than one made locally) is a separate follow-up: data/ and chroma_db/ are gitignored, so a
# runner has neither the source PDFs nor the vector store yet.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Compare baseline vs candidate
        shell: bash
        run: |
          set -o pipefail
          uv run python -m evals.compare | tee -a "$GITHUB_STEP_SUMMARY"
