name: Run E2E Tests

# Manual trigger only. Runs the pytest suite in tests/ -- fast, free, deterministic checks
# (no OpenAI calls, no PDFs, no chroma_db needed for what's written so far). Kept separate
# from the eval suite workflows: this validates FUNCTIONAL correctness (does the code behave
# as expected?), not subjective quality (that's what evals/ + LLM judges are for).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pytest
        run: uv run pytest -v
